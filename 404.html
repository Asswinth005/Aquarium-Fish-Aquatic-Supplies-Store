<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | DeepBlue Aquatics</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="description" content="Page not found. The page you're looking for doesn't exist or has been moved.">

    <!-- Tailwind CSS -->
    <script src="tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'deep-teal': '#0A4C5C',
                        'coral-pink': '#FF7F7F',
                        'sand-beige': '#F4E9D8',
                        'seafoam': '#A8D5D9',
                        'ocean-blue': '#006A8A',
                        'driftwood': '#9C7A5E',
                        'reef-gold': '#E6B85C',
                    },
                    fontFamily: {
                        'serif': ['Cormorant Garamond', 'Georgia', 'serif'],
                        'heading': ['Playfair Display', 'serif'],
                        'body': ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                        'sans': ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'swim': 'swim 8s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        swim: {
                            '0%, 100%': { transform: 'translateX(0px)' },
                            '50%': { transform: 'translateX(12px)' },
                        },
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Great+Vibes&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: #F4F8FA;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1A2E35;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .dark body {
            background: #0B1A1E;
            color: #D4E9ED;
        }

        p {
            line-height: 1.8;
            letter-spacing: 0.01em;
        }

        h1, h2, h3, h4, .heading-font {
            font-family: 'Playfair Display', serif;
        }

        /* Toggle Buttons */
        .toggle-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #EBF5F8;
            border: 1.5px solid #006A8A;
            color: #006A8A;
            font-size: 1.1rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 106, 138, 0.12);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dark .toggle-btn {
            background: #152E35;
            border-color: #7FC1C9;
            color: #7FC1C9;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }
        .toggle-btn:hover {
            background: #006A8A;
            color: #FFFFFF;
            border-color: #006A8A;
            transform: scale(1.08) translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 106, 138, 0.3);
        }
        .dark .toggle-btn:hover {
            background: #7FC1C9;
            color: #0B1A1E;
            border-color: #7FC1C9;
        }

        /* Button styles */
        .btn-primary {
            background: #006A8A;
            color: white;
            padding: 0.8rem 2rem;
            font-family: 'Libre Baskerville', serif;
            font-weight: 600;
            transition: all 0.3s;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
            cursor: pointer;
        }

        .dark .btn-primary {
            background: #7FC1C9;
            color: #0B1A1E;
        }

        .btn-primary:hover {
            background: #004B63;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 106, 138, 0.3);
        }

        .dark .btn-primary:hover {
            background: #5A9CA5;
            box-shadow: 0 8px 20px rgba(127, 193, 201, 0.3);
        }

        .btn-secondary {
            border: 1.5px solid #006A8A;
            background: transparent;
            color: #006A8A;
            padding: 0.75rem 1.8rem;
            border-radius: 40px;
            font-family: 'Libre Baskerville', serif;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .dark .btn-secondary {
            border-color: #7FC1C9;
            color: #7FC1C9;
        }

        .btn-secondary:hover {
            background: #006A8A;
            color: white;
        }

        .dark .btn-secondary:hover {
            background: #7FC1C9;
            color: #0B1A1E;
        }

        .aquatic-line {
            width: 70px;
            height: 3px;
            background: #E6B85C;
            margin: 1rem auto;
        }

        /* RTL fixes */
        [dir="rtl"] {
            direction: rtl;
        }

        [dir="rtl"] .space-x-3 > :not([hidden]) ~ :not([hidden]) {
            --tw-space-x-reverse: 1;
            margin-right: calc(0.75rem * var(--tw-space-x-reverse));
            margin-left: calc(0.75rem * calc(1 - var(--tw-space-x-reverse)));
        }

        [dir="rtl"] .mr-2 {
            margin-right: 0;
            margin-left: 0.5rem;
        }

        [dir="rtl"] .mr-1 {
            margin-right: 0;
            margin-left: 0.25rem;
        }

        [dir="rtl"] .gap-4 {
            gap: 1rem;
        }
    </style>
</head>
<body class="bg-[#F4F8FA] dark:bg-[#0B1A1E]">

    <!-- ========== HEADER ========== -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/90 dark:bg-[#0E1E24]/95 backdrop-blur-md border-b border-seafoam/40">
        <div class="container mx-auto px-6">
            <div class="flex items-center justify-between h-20">
                <!-- Logo -->
                <a href="index.html" class="flex items-center space-x-3 group">
                    <div class="w-10 h-10 bg-[#006A8A] flex items-center justify-center rounded-full">
                        <i class="fas fa-fish text-white text-xl"></i>
                    </div>
                    <div>
                        <span class="text-2xl font-heading font-semibold text-[#006A8A] dark:text-[#7FC1C9]">DeepBlue</span>
                    </div>
                </a>

                <!-- Toggle Buttons -->
                <div class="flex items-center gap-3">
                    <button id="theme-toggle" class="toggle-btn" title="Theme">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button id="rtl-toggle" class="toggle-btn" title="RTL">
                        ⇄
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ========== 404 MAIN CONTENT ========== -->
    <div class="min-h-screen flex items-center justify-center pt-32 pb-16 px-6">
        <div class="max-w-2xl mx-auto text-center">

            <!-- Large 404 Number with fish icon decoration -->
            <div class="mb-6 relative">
                <span class="text-[140px] md:text-[200px] font-heading font-black text-ocean-blue/20 dark:text-reef-gold/20 leading-none tracking-tighter">404</span>
                <div class="absolute inset-0 flex items-center justify-center">
                    <i class="fas fa-fish text-6xl md:text-8xl text-ocean-blue/30 dark:text-reef-gold/30 animate-float"></i>
                </div>
            </div>

            <!-- Icon -->
            <div class="w-20 h-20 bg-ocean-blue/10 dark:bg-reef-gold/10 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-compass text-ocean-blue dark:text-reef-gold text-3xl"></i>
            </div>

            <!-- Title -->
            <h1 class="text-3xl md:text-4xl font-heading font-bold text-deep-teal dark:text-white mb-3">
                Lost at Sea?
            </h1>

            <!-- Divider -->
            <div class="aquatic-line"></div>

            <!-- Message -->
            <p class="text-lg md:text-xl font-serif text-deep-teal/70 dark:text-sand-beige/70 mb-8 leading-relaxed">
                The page you're looking for swam away or never existed.<br>
                Let's get you back to the aquarium.
            </p>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-4 justify-center mb-10">
                <a href="index.html" class="btn-primary">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <a href="contact.html" class="btn-secondary">
                    <i class="fas fa-envelope"></i> Contact Support
                </a>
            </div>

            <!-- Quick Links -->
            <div class="border-t border-seafoam/20 dark:border-reef-gold/20 pt-8">
                <p class="text-sm font-serif text-deep-teal/70 dark:text-sand-beige/90 mb-4">
                    <i class="fas fa-water text-reef-gold mr-2"></i> Quick Navigation
                </p>
                <div class="flex flex-wrap gap-4 justify-center">
                    <a href="about.html" class="text-sm font-serif text-deep-teal/80 dark:text-sand-beige/90 hover:text-ocean-blue dark:hover:text-reef-gold transition">About Us</a>
                    <span class="text-reef-gold/30">|</span>
                    <a href="fish.html" class="text-sm font-serif text-deep-teal/80 dark:text-sand-beige/90 hover:text-ocean-blue dark:hover:text-reef-gold transition">Fish</a>
                    <span class="text-reef-gold/30">|</span>
                    <a href="plants.html" class="text-sm font-serif text-deep-teal/80 dark:text-sand-beige/90 hover:text-ocean-blue dark:hover:text-reef-gold transition">Plants</a>
                    <span class="text-reef-gold/30">|</span>
                    <a href="supplies.html" class="text-sm font-serif text-deep-teal/80 dark:text-sand-beige/90 hover:text-ocean-blue dark:hover:text-reef-gold transition">Supplies</a>
                    <span class="text-reef-gold/30">|</span>
                    <a href="contact.html" class="text-sm font-serif text-deep-teal/80 dark:text-sand-beige/90 hover:text-ocean-blue dark:hover:text-reef-gold transition">Contact</a>
                </div>
            </div>

            <!-- Fun fish fact -->
            <div class="mt-8 text-sm text-deep-teal/70 dark:text-sand-beige/85 italic">
                <i class="fas fa-fish text-reef-gold mr-1"></i>
                Fun fact: Some fish can swim backwards — but this page can't!
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme Toggle
            const themeBtn = document.getElementById('theme-toggle');

            const updateThemeUI = (isDark) => {
                if (themeBtn) {
                    const icon = themeBtn.querySelector('i');
                    if (icon) {
                        icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
                    }
                    themeBtn.classList.toggle('active', isDark);
                }
            };

            const toggleTheme = () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                updateThemeUI(isDark);
            };

            if (themeBtn) themeBtn.addEventListener('click', toggleTheme);

            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
                updateThemeUI(true);
            }

            // RTL Toggle
            const rtlBtn = document.getElementById('rtl-toggle');

            const updateRtlUI = (isRtl) => {
                const dir = isRtl ? 'rtl' : 'ltr';
                document.documentElement.dir = dir;
                document.documentElement.lang = isRtl ? 'ar' : 'en';
                if (rtlBtn) rtlBtn.classList.toggle('active', isRtl);
            };

            const toggleRtl = () => {
                const isRtl = document.documentElement.dir !== 'rtl';
                localStorage.setItem('dir', isRtl ? 'rtl' : 'ltr');
                updateRtlUI(isRtl);
            };

            if (rtlBtn) rtlBtn.addEventListener('click', toggleRtl);

            if (localStorage.getItem('dir') === 'rtl') {
                updateRtlUI(true);
            }
        });
    </script>
</body>
</html>
